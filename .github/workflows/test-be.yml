name: Run Go Tests

on:
  pull_request:
    branches: [disabled-simplified-fe-server]
  push:
    branches: disabled-simplified-fe-server]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v2

      - name: Set up Go
        uses: actions/setup-go@v2
        with:
          go-version: 1.24

      - name: Install dependencies
        run: go mod tidy

      - name: Run tests
        run: make vet

      - name: Run tests
        run: make test-server
