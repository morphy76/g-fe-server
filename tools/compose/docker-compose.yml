# stack for development purposes
services:
  # Databases

  go_db:
    image: mongo:8
    platform: linux/amd64
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: go_root
      MONGO_INITDB_ROOT_PASSWORD: go_password
      MONGO_INITDB_DATABASE: fe_db
    ports:
      - "27017:27017"
    volumes:
      - ./imports/init_db.d:/docker-entrypoint-initdb.d
      - fe_data:/data/db
    networks:
      - fe-private-network

  relational-db:
    image: postgres:17
    platform: linux/amd64
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
      PGDATA: /var/lib/postgresql/data/pgdata
    networks:
      - fe-private-network
    volumes:
      - pgsql_data:/var/lib/postgresql/data
      - ./imports/pgsql:/docker-entrypoint-initdb.d

  # Infrastructural services

  iam:
    image: quay.io/keycloak/keycloak:26.2
    platform: linux/amd64
    restart: unless-stopped
    command:
      - start-dev
      - --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    volumes:
      - ./imports/realm:/opt/keycloak/data/import
    network_mode: "host"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    platform: linux/amd64
    volumes:
      - ./imports/otel/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml
    ports:
      - 4317:4317 # OTLP gRPC receiver
    networks:
      - fe-private-network

  unleash-edge:
    image: unleashorg/unleash-edge:v19.11
    platform: linux/amd64
    command: ["edge"]
    restart: unless-stopped
    ports:
      - "3063:3063"
    depends_on:
      - "unleash"
    environment:
      UPSTREAM_URL: http://unleash:4242/
      TOKENS: "default:development.f9e56e74a070c76b577840b2adb2ca195d394a2c3bd8915a93e6d617"
      STRICT: true
    networks:
      - fe-private-network

  # Monitoring services

  zipkin:
    image: openzipkin/zipkin-slim:3
    platform: linux/amd64
    restart: unless-stopped
    ports:
      - "9411:9411"
    depends_on:
      - "otel-collector"
    networks:
      - fe-private-network

  prometheus:
    image: prom/prometheus:v3.4.1
    platform: linux/amd64
    restart: unless-stopped
    volumes:
      - ./imports/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - "otel-collector"
    networks:
      - fe-private-network

  # Development tools

  unleash:
    image: unleashorg/unleash-server:7
    platform: linux/amd64
    restart: unless-stopped
    ports:
      - "4242:4242"
    depends_on:
      - "relational-db"
    environment:
      DATABASE_HOST: relational-db
      DATABASE_NAME: feat_db
      DATABASE_USERNAME: feat_user
      DATABASE_PASSWORD: feat_password
      DATABASE_SCHEMA: feat_schema
      DATABASE_SSL: false
    networks:
      - fe-private-network

  pgcli:
    image: dpage/pgadmin4:latest
    platform: linux/amd64
    restart: unless-stopped
    depends_on:
      - "relational-db"
    environment:
      PGADMIN_DEFAULT_EMAIL: riccardo.pasquini@gmail.com
      PGADMIN_DEFAULT_PASSWORD: pgcli_password
      PGPASSWORD: adminpassword
      PGUSER: admin
      PGHOST: relational-db
    ports:
      - "5050:80"
    networks:
      - fe-private-network

  mongo-express:
    image: mongo-express:latest
    platform: linux/amd64
    restart: unless-stopped
    ports:
      - 8081:8081
    depends_on:
      - "go_db"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: go_root
      ME_CONFIG_MONGODB_ADMINPASSWORD: go_password
      ME_CONFIG_MONGODB_SERVER: go_db
    networks:
      - fe-private-network

